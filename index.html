<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNGdle - Achievement Hunter</title>
    <style>
        :root {
            --bg: #090a0f;
            --card-bg: #131722;
            --card-border: #262d40;
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.4);
            --gold: #f59e0b;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --locked: #334155;
            --hl-color: #38bdf8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 950px; width: 100%; display: flex; flex-direction: column; gap: 25px; }

        /* Stats Bar */
        .stats-bar { background: var(--card-bg); border-radius: 12px; padding: 20px; display: flex; justify-content: space-around; text-align: center; border: 1px solid var(--card-border); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .stat-box h3 { font-size: 0.8rem; color: var(--subtext); text-transform: uppercase; letter-spacing: 1px; }
        .stat-box p { font-size: 1.8rem; font-weight: bold; color: var(--accent); margin-top: 4px; }

        /* Generator Area */
        .generator-card { background: var(--card-bg); border-radius: 16px; padding: 35px; text-align: center; border: 1px solid var(--card-border); display: flex; flex-direction: column; align-items: center; gap: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
        
        .number-box { 
            font-family: 'Courier New', monospace; font-size: 4rem; font-weight: 900; letter-spacing: 10px; color: #ffffff; 
            background: #050608; padding: 20px 40px; border-radius: 12px; border: 2px solid var(--accent); 
            box-shadow: 0 0 20px var(--accent-glow); min-height: 110px; min-width: 350px; display: flex; justify-content: center; align-items: center; 
        }

        /* Highlighting Class */
        .hl { color: var(--hl-color); text-shadow: 0 0 12px var(--hl-color); font-weight: 900; }

        /* Roll Button & Timer */
        .roll-btn { background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff; border: none; padding: 16px 50px; font-size: 1.3rem; font-weight: 800; border-radius: 30px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); text-transform: uppercase; letter-spacing: 1px; }
        .roll-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(168, 85, 247, 0.6); }
        .roll-btn:disabled { background: #1e293b; color: #475569; cursor: not-allowed; box-shadow: none; }
        .timer-text { font-size: 0.95rem; color: var(--subtext); }

        /* Achievements Display Area */
        .achievements-container { width: 100%; max-width: 550px; display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .achievement-card { 
            background: #1a202c; border: 1px solid #2d3748; border-radius: 8px; padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            animation: slideIn 0.5s ease forwards; opacity: 0; transform: translateY(10px);
        }
        .ach-info { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
        
        .ach-header { display: flex; align-items: center; gap: 10px; }
        .ach-name { font-weight: bold; font-size: 1.15rem; color: #fff; }
        .ach-desc { font-size: 0.85rem; color: var(--subtext); font-style: italic; }
        .ach-score { font-size: 0.9rem; font-weight: bold; color: var(--gold); margin-top: 4px; }
        
        .ach-num-display { font-family: 'Courier New', monospace; font-size: 1.4rem; font-weight: bold; letter-spacing: 4px; background: #000; padding: 8px 15px; border-radius: 6px; }

        /* Tier Badges */
        .tier-badge { padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .badge-common { background: rgba(148,163,184,0.2); color: #cbd5e1; border: 1px solid #64748b; }
        .badge-uncommon { background: rgba(34,197,94,0.2); color: #4ade80; border: 1px solid #16a34a; }
        .badge-rare { background: rgba(59,130,246,0.2); color: #60a5fa; border: 1px solid #2563eb; }
        .badge-epic { background: rgba(168,85,247,0.2); color: #c084fc; border: 1px solid #9333ea; }
        .badge-legendary { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid #d97706; }
        .badge-mythic { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid #dc2626; box-shadow: 0 0 10px rgba(239,68,68,0.4); }

        /* Final Rarity Banner */
        .final-banner { margin-top: 20px; font-size: 1.6rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; opacity: 0; transition: opacity 0.5s ease; padding: 15px; border-radius: 8px; width: 100%; text-align: center; }
        .tier-text-common { color: #94a3b8; text-shadow: 0 0 10px rgba(148,163,184,0.5); }
        .tier-text-rare { color: #3b82f6; text-shadow: 0 0 10px rgba(59,130,246,0.5); }
        .tier-text-epic { color: #a855f7; text-shadow: 0 0 10px rgba(168,85,247,0.5); }
        .tier-text-legendary { color: var(--gold); text-shadow: 0 0 10px rgba(245,158,11,0.5); }
        .tier-text-mythic { color: #ef4444; text-shadow: 0 0 10px rgba(239,68,68,0.5); }

        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

        /* Upgrade Tree Structure */
        .tree-section { background: var(--card-bg); border-radius: 16px; padding: 30px 20px; border: 1px solid var(--card-border); position: relative; }
        .section-title { font-size: 1.4rem; color: #fff; text-align: center; margin-bottom: 25px; }
        .tree-container { position: relative; display: flex; flex-direction: column; align-items: center; gap: 50px; padding: 20px 0; width: 100%; }
        .svg-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .tree-tier { display: flex; justify-content: center; gap: 20px; width: 100%; z-index: 2; }
        
        .tree-node { 
            background: #0f131c; border: 2px solid var(--locked); border-radius: 12px; padding: 15px; width: 180px; 
            text-align: center; cursor: pointer; transition: all 0.25s ease; display: flex; flex-direction: column; justify-content: space-between; z-index: 2;
        }
        .tree-node.unlocked { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
        .tree-node.bought { background: linear-gradient(145deg, #1c142b, #0f131c); border-color: var(--gold); box-shadow: 0 0 15px rgba(245,158,11,0.3); }
        .tree-node.locked { opacity: 0.5; cursor: not-allowed; }
        .node-title { font-size: 0.95rem; font-weight: bold; color: #fff; margin-bottom: 6px; }
        .node-desc { font-size: 0.75rem; color: var(--subtext); margin-bottom: 10px; line-height: 1.2; }
        .node-cost { font-size: 0.85rem; font-weight: bold; color: var(--gold); background: rgba(245,158,11,0.1); padding: 4px 8px; border-radius: 6px; }

        /* Admin */
        .admin-card { background: var(--card-bg); border-radius: 12px; padding: 15px 20px; border: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
        .admin-card input { background: #0f131c; border: 1px solid var(--card-border); color: #fff; padding: 8px 12px; border-radius: 6px; outline: none; }
        .admin-card button { background: #334155; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="stats-bar">
        <div class="stat-box"><h3>Total Score</h3><p id="ui-pts">0</p></div>
        <div class="stat-box"><h3>Total Rolls</h3><p id="ui-rolls">0</p></div>
        <div class="stat-box"><h3>Best Roll</h3><p id="ui-best">0</p></div>
    </div>

    <div class="generator-card">
        <div class="number-box" id="number-display">?</div>
        
        <button class="roll-btn" id="btn-roll" onclick="startRollSequence()">Roll</button>
        <div class="timer-text" id="cooldown-display">Ready to roll!</div>

        <!-- Achievements spawn here dynamically -->
        <div class="achievements-container" id="achievements-container"></div>
        <div class="final-banner" id="final-banner"></div>
    </div>

    <div class="tree-section">
        <div class="section-title">Upgrade Tree</div>
        <div class="tree-container" id="tree-container">
            <svg class="svg-lines" id="svg-lines"></svg>
            <div class="tree-tier" id="tier-0"></div>
            <div class="tree-tier" id="tier-1"></div>
            <div class="tree-tier" id="tier-2"></div>
            <div class="tree-tier" id="tier-3"></div>
        </div>
    </div>

    <div class="admin-card">
        <div><span style="color:#94a3b8; font-size: 0.9rem;">Admin Code:</span></div>
        <div style="display:flex; gap:10px;">
            <input type="text" id="admin-code" placeholder="Enter code...">
            <button onclick="checkCode()">Submit</button>
        </div>
    </div>
</div>

<script>
    /* =====================================================================
       1. GAME STATE
       ===================================================================== */
    let GAME = {
        pts: 0, rolls: 0, best: 0, upgrades: [], cooldownReady: 0, isRolling: false,
    };

    let baseCooldown = 8000; 

    if (localStorage.getItem('rngdleAchieveSave')) {
        let saved = JSON.parse(localStorage.getItem('rngdleAchieveSave'));
        GAME = { ...GAME, ...saved };
    }

    /* =====================================================================
       2. ACHIEVEMENT DEFINITIONS (Balanced Mathematically)
       ===================================================================== */
    
    function highlightIndices(str, indicesArr) {
        return str.split('').map((char, i) => indicesArr.includes(i) ? `<span class="hl">${char}</span>` : char).join('');
    }
    function allIndices(len) { return Array.from({length: len}, (_, i) => i); }

    // Balanced Scoring Tiers:
    // Common: 10 - 50 pts
    // Uncommon: 100 - 300 pts
    // Rare: 800 - 1500 pts
    // Epic: 4000 - 8000 pts
    // Legendary: 20000 - 50000 pts
    // Mythic: 150000+ pts

    const ACHIEVEMENTS = [
        {
            id: 'length7', name: '7 Digit Number', score: 150000, tier: 'mythic',
            desc: "A colossal anomaly of length. (0.2% Base Chance)",
            check: (s) => s.length === 7, getHtml: (s) => highlightIndices(s, allIndices(s.length))
        },
        {
            id: 'length6', name: '6 Digit Number', score: 15, tier: 'common',
            desc: "The standard length for a roll. (50% Base Chance)",
            check: (s) => s.length === 6, getHtml: (s) => highlightIndices(s, allIndices(s.length))
        },
        {
            id: 'length5', name: '5 Digit Number', score: 100, tier: 'uncommon',
            desc: "Slightly truncated. (25% Base Chance)",
            check: (s) => s.length === 5, getHtml: (s) => highlightIndices(s, allIndices(s.length))
        },
        {
            id: 'length4', name: '4 Digit Number', score: 250, tier: 'uncommon',
            desc: "Four perfect digits. (15% Base Chance)",
            check: (s) => s.length === 4, getHtml: (s) => highlightIndices(s, allIndices(s.length))
        },
        {
            id: 'length3', name: '3 Digit Number', score: 1000, tier: 'rare',
            desc: "A compact trio. (7% Base Chance)",
            check: (s) => s.length === 3, getHtml: (s) => highlightIndices(s, allIndices(s.length))
        },
        {
            id: 'length2', name: '2 Digit Number', score: 5000, tier: 'epic',
            desc: "A tiny two-digit pair. (2% Base Chance)",
            check: (s) => s.length === 2, getHtml: (s) => highlightIndices(s, allIndices(s.length))
        },
        {
            id: 'length1', name: '1 Digit Number', score: 25000, tier: 'legendary',
            desc: "The purest form of a number. (0.8% Base Chance)",
            check: (s) => s.length === 1, getHtml: (s) => highlightIndices(s, allIndices(s.length))
        },
        {
            id: 'even', name: 'Even Number', score: 10, tier: 'common',
            desc: "Ends in 0, 2, 4, 6, or 8.",
            check: (s) => parseInt(s[s.length-1]) % 2 === 0, 
            getHtml: (s) => highlightIndices(s, [s.length-1])
        },
        {
            id: 'odd', name: 'Odd Number', score: 10, tier: 'common',
            desc: "Ends in 1, 3, 5, 7, or 9.",
            check: (s) => parseInt(s[s.length-1]) % 2 !== 0, 
            getHtml: (s) => highlightIndices(s, [s.length-1])
        },
        {
            id: 'void', name: 'Void', score: 20, tier: 'common',
            desc: "The number contains absolutely no zeros.",
            check: (s) => !s.includes('0'), 
            getHtml: (s) => highlightIndices(s, allIndices(s.length))
        },
        {
            id: 'neighbours', name: 'Neighbours', score: 25, tier: 'common',
            desc: "Contains two adjacent digits next to each other in value.",
            check: (s) => s.length >= 2 && s.split('').some((c, i) => i < s.length-1 && Math.abs(parseInt(c) - parseInt(s[i+1])) === 1),
            getHtml: (s) => {
                let idx = s.split('').findIndex((c, i) => i < s.length-1 && Math.abs(parseInt(c) - parseInt(s[i+1])) === 1);
                return highlightIndices(s, [idx, idx+1]);
            }
        },
        {
            id: 'consecDoublePair', name: 'Consecutive Double Pair', score: 1200, tier: 'rare',
            desc: "Two distinct pairs stacked right beside each other.",
            check: (s) => /(.)\1(?!\1)(.)\2/.test(s),
            getHtml: (s) => {
                let match = s.match(/(.)\1(?!\1)(.)\2/);
                return highlightIndices(s, [match.index, match.index+1, match.index+2, match.index+3]);
            }
        },
        {
            id: 'doublePair', name: 'Double Pair', score: 200, tier: 'uncommon',
            desc: "Contains two sets of pairs scattered within the number.",
            check: (s) => {
                let counts = {};
                for(let c of s) counts[c] = (counts[c]||0)+1;
                return Object.values(counts).filter(v => v >= 2).length >= 2;
            },
            getHtml: (s) => {
                let counts = {};
                for(let c of s) counts[c] = (counts[c]||0)+1;
                let pairs = Object.keys(counts).filter(k => counts[k] >= 2).slice(0, 2);
                let indices = [];
                s.split('').forEach((c, i) => { if(pairs.includes(c)) indices.push(i); });
                return highlightIndices(s, indices);
            }
        },
        {
            id: 'consecPair', name: 'Consecutive Pair', score: 30, tier: 'common',
            desc: "Two identical digits right next to each other.",
            check: (s) => /(.)\1/.test(s),
            getHtml: (s) => {
                let match = s.match(/(.)\1/);
                return highlightIndices(s, [match.index, match.index+1]);
            }
        },
        {
            id: 'pair', name: 'Pair', score: 15, tier: 'common',
            desc: "Contains two of the exact same digit.",
            check: (s) => new Set(s).size < s.length,
            getHtml: (s) => {
                let counts = {};
                for(let c of s) counts[c] = (counts[c]||0)+1;
                let pairChar = Object.keys(counts).find(k => counts[k] >= 2);
                let indices = [];
                s.split('').forEach((c, i) => { if(c === pairChar) indices.push(i); });
                return highlightIndices(s, indices);
            }
        },
        {
            id: 'luckySevens', name: 'Lucky Sevens', score: 800, tier: 'rare',
            desc: "Hit a consecutive pair of 7s.",
            check: (s) => s.includes('77'),
            getHtml: (s) => {
                let idx = s.indexOf('77');
                return highlightIndices(s, [idx, idx+1]);
            }
        },
        {
            id: 'sevens', name: "7's", score: 150, tier: 'uncommon',
            desc: "Contains a pair of 7s anywhere in the string.",
            check: (s) => (s.match(/7/g) || []).length >= 2,
            getHtml: (s) => {
                let indices = [];
                s.split('').forEach((c, i) => { if(c === '7') indices.push(i); });
                return highlightIndices(s, indices);
            }
        },
        {
            id: 'lowBall', name: 'Low Ball', score: 6000, tier: 'epic',
            desc: "Every digit in the number is 4 or below.",
            check: (s) => /^[0-4]+$/.test(s),
            getHtml: (s) => highlightIndices(s, allIndices(s.length))
        },
        {
            id: 'highRoll', name: 'High Roll', score: 6000, tier: 'epic',
            desc: "Every digit in the number is 5 or above.",
            check: (s) => /^[5-9]+$/.test(s),
            getHtml: (s) => highlightIndices(s, allIndices(s.length))
        },
        {
            id: 'heterogeneous', name: 'Heterogeneous', score: 180, tier: 'uncommon',
            desc: "Every single digit is completely unique.",
            check: (s) => new Set(s).size === s.length && s.length > 1,
            getHtml: (s) => highlightIndices(s, allIndices(s.length))
        },
        {
            id: 'lucky7', name: 'Lucky 7', score: 150, tier: 'uncommon',
            desc: "The entire number is cleanly divisible by 7.",
            check: (s) => Number(s) % 7 === 0 && Number(s) > 0,
            getHtml: (s) => highlightIndices(s, allIndices(s.length))
        },
        {
            id: 'runner', name: 'Runner', score: 1500, tier: 'rare',
            desc: "Three or more digits are in perfect ascending order.",
            check: (s) => s.length >= 3 && s.split('').some((c, i) => 
                i < s.length-2 && parseInt(s[i+1]) === parseInt(c)+1 && parseInt(s[i+2]) === parseInt(c)+2
            ),
            getHtml: (s) => {
                let idx = s.split('').findIndex((c, i) => i < s.length-2 && parseInt(s[i+1]) === parseInt(c)+1 && parseInt(s[i+2]) === parseInt(c)+2);
                return highlightIndices(s, [idx, idx+1, idx+2]);
            }
        },
        {
            id: 'pocketMirror', name: 'Pocket Mirror', score: 1200, tier: 'rare',
            desc: "Contains a mirrored palindrome inside the number.",
            check: (s) => {
                if(s.length < 3) return false;
                for(let i=0; i<s.length-2; i++) {
                    if (s[i] === s[i+2]) return true; 
                    if (i<s.length-3 && s[i] === s[i+3] && s[i+1] === s[i+2]) return true;
                }
                return false;
            },
            getHtml: (s) => {
                for(let i=0; i<s.length-3; i++) {
                    if (s[i] === s[i+3] && s[i+1] === s[i+2]) return highlightIndices(s, [i, i+1, i+2, i+3]);
                }
                for(let i=0; i<s.length-2; i++) {
                    if (s[i] === s[i+2]) return highlightIndices(s, [i, i+1, i+2]);
                }
                return s;
            }
        },
        {
            id: 'mirror', name: 'Mirror', score: 50000, tier: 'legendary',
            desc: "The entire number reads the exact same backwards.",
            check: (s) => s.length > 1 && s === s.split('').reverse().join(''),
            getHtml: (s) => highlightIndices(s, allIndices(s.length))
        },
        {
            id: 'translucent', name: 'Translucent', score: 7500, tier: 'epic',
            desc: "The number starts and ends with a zero.",
            check: (s) => s.length >= 2 && s.startsWith('0') && s.endsWith('0'),
            getHtml: (s) => highlightIndices(s, [0, s.length-1])
        },
        {
            id: 'century', name: 'Century', score: 1000, tier: 'rare',
            desc: "The number ends with double zeros.",
            check: (s) => s.length >= 2 && s.endsWith('00'),
            getHtml: (s) => highlightIndices(s, [s.length-2, s.length-1])
        }
    ];

    /* =====================================================================
       3. UPGRADE TREE
       ===================================================================== */
    const TREE = [
        { id: "root", title: "Core Engine", desc: "+20% Base Points", cost: 0, req: [], tier: 0 },
        { id: "luck1", title: "RNG Manipulator", desc: "Boost rare string lengths", cost: 250, req: ["root"], tier: 1 },
        { id: "time1", title: "Clockwork I", desc: "-1.5s Cooldown", cost: 500, req: ["root"], tier: 1 },
        { id: "pts1", title: "Score Multiplier", desc: "+50% Points", cost: 750, req: ["root"], tier: 1 },
        { id: "luck2", title: "Anomaly", desc: "Huge boost to lengths 1 & 7", cost: 2500, req: ["luck1"], tier: 2 },
        { id: "time2", title: "Clockwork II", desc: "-2s Cooldown", cost: 4000, req: ["time1"], tier: 2 },
        { id: "pts2", title: "Combo Master", desc: "2x pts if base score > 1500", cost: 6000, req: ["pts1"], tier: 2 },
        { id: "apex", title: "Apex System", desc: "-3s CD & +100% Points", cost: 25000, req: ["luck2", "time2", "pts2"], tier: 3 }
    ];

    /* =====================================================================
       4. GENERATION LOGIC & ANIMATION
       ===================================================================== */
    
    function determineLength() {
        let max = 1000;
        let r = Math.random() * max;
        
        let w = { l6: 500, l5: 250, l4: 150, l3: 70, l2: 20, l1: 8, l7: 2 };
        if (GAME.upgrades.includes("luck1")) { w.l3 += 30; w.l2 += 30; w.l1 += 20; w.l7 += 8; }
        if (GAME.upgrades.includes("luck2")) { w.l1 += 100; w.l7 += 40; w.l2 += 50; }

        let totalWeight = Object.values(w).reduce((a, b) => a + b, 0);
        r = (r / max) * totalWeight;

        if (r < w.l6) return 6; r -= w.l6;
        if (r < w.l5) return 5; r -= w.l5;
        if (r < w.l4) return 4; r -= w.l4;
        if (r < w.l3) return 3; r -= w.l3;
        if (r < w.l2) return 2; r -= w.l2;
        if (r < w.l1) return 1;
        return 7;
    }

    function generateNumber(length) {
        let res = "";
        for (let i = 0; i < length; i++) res += Math.floor(Math.random() * 10).toString();
        return res;
    }

    function startRollSequence() {
        if (GAME.isRolling || Date.now() < GAME.cooldownReady) return;
        GAME.isRolling = true;
        
        document.getElementById("btn-roll").disabled = true;
        document.getElementById("btn-roll").innerText = "Rolling...";
        
        document.getElementById("achievements-container").innerHTML = "";
        document.getElementById("final-banner").style.opacity = "0";
        
        let targetLen = determineLength();
        let targetStr = generateNumber(targetLen);
        
        let display = document.getElementById("number-display");
        let cycles = 0;
        let lockedStr = "";
        
        let scrambleTimer = setInterval(() => {
            cycles++;
            let tempStr = lockedStr;
            let remainingLen = targetLen - lockedStr.length;
            
            for(let i=0; i<remainingLen; i++) tempStr += Math.floor(Math.random() * 10);
            display.innerText = tempStr;

            if (cycles % 4 === 0 && lockedStr.length < targetLen) {
                lockedStr += targetStr[lockedStr.length];
            }

            if (lockedStr.length === targetLen) {
                clearInterval(scrambleTimer);
                display.innerText = targetStr;
                processNumber(targetStr);
            }
        }, 80); 
    }

    /* =====================================================================
       5. ACHIEVEMENT PROCESSING & DISPLAY
       ===================================================================== */
    
    function processNumber(numStr) {
        let earned = [];
        let matchedIds = [];

        ACHIEVEMENTS.forEach(ach => {
            if (ach.check(numStr)) {
                earned.push({ ...ach, html: ach.getHtml(numStr) });
                matchedIds.push(ach.id);
            }
        });

        // Filter overlaps
        if (matchedIds.includes("consecDoublePair")) earned = earned.filter(a => a.id !== "consecPair" && a.id !== "pair" && a.id !== "doublePair");
        else if (matchedIds.includes("doublePair")) earned = earned.filter(a => a.id !== "pair");
        else if (matchedIds.includes("consecPair")) earned = earned.filter(a => a.id !== "pair");
        
        if (matchedIds.includes("luckySevens")) earned = earned.filter(a => a.id !== "sevens");
        if (matchedIds.includes("mirror")) earned = earned.filter(a => a.id !== "pocketMirror");

        displayAchievementsSlowly(earned, numStr);
    }

    function displayAchievementsSlowly(earnedArr, numStr) {
        let container = document.getElementById("achievements-container");
        let idx = 0;
        let totalBaseScore = 0;

        function showNext() {
            if (idx < earnedArr.length) {
                let ach = earnedArr[idx];
                totalBaseScore += ach.score;

                let div = document.createElement("div");
                div.className = "achievement-card";
                div.innerHTML = `
                    <div class="ach-info">
                        <div class="ach-header">
                            <span class="ach-name">${ach.name}</span>
                            <span class="tier-badge badge-${ach.tier}">${ach.tier}</span>
                        </div>
                        <div class="ach-desc">${ach.desc}</div>
                        <div class="ach-score">+${ach.score.toLocaleString()} pts</div>
                    </div>
                    <div class="ach-num-display">${ach.html}</div>
                `;
                container.appendChild(div);
                
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

                idx++;
                setTimeout(showNext, 600); 
            } else {
                finalizeRoll(totalBaseScore);
            }
        }
        
        setTimeout(showNext, 400);
    }

    function finalizeRoll(baseScore) {
        let finalScore = baseScore;

        let mult = 1;
        if (GAME.upgrades.includes("root")) mult += 0.2;
        if (GAME.upgrades.includes("pts1")) mult += 0.5;
        if (GAME.upgrades.includes("apex")) mult += 1.0;
        
        finalScore = Math.floor(finalScore * mult);
        if (GAME.upgrades.includes("pts2") && baseScore > 1500) finalScore *= 2;

        GAME.pts += finalScore;
        GAME.rolls++;
        if (finalScore > GAME.best) GAME.best = finalScore;

        updateUI();

        let banner = document.getElementById("final-banner");
        let rarityText, tierClass;
        
        // Final tier thresholds adjusted to match the new scoring system
        if (finalScore >= 150000) { rarityText = "MYTHIC"; tierClass = "tier-text-mythic"; }
        else if (finalScore >= 25000) { rarityText = "LEGENDARY"; tierClass = "tier-text-legendary"; }
        else if (finalScore >= 5000) { rarityText = "EPIC"; tierClass = "tier-text-epic"; }
        else if (finalScore >= 1000) { rarityText = "RARE"; tierClass = "tier-text-rare"; }
        else { rarityText = "COMMON"; tierClass = "tier-text-common"; }

        banner.innerText = `${rarityText} ROLL! (+${finalScore.toLocaleString()} pts)`;
        banner.className = `final-banner ${tierClass}`;
        banner.style.opacity = "1";

        let cd = baseCooldown;
        if (GAME.upgrades.includes("time1")) cd -= 1500;
        if (GAME.upgrades.includes("time2")) cd -= 2000;
        if (GAME.upgrades.includes("apex")) cd -= 3000;
        
        GAME.cooldownReady = Date.now() + cd;
        GAME.isRolling = false;
        saveGame();
    }

    /* =====================================================================
       6. UI & TIMERS
       ===================================================================== */
    
    function updateUI() {
        document.getElementById("ui-pts").innerText = GAME.pts.toLocaleString();
        document.getElementById("ui-rolls").innerText = GAME.rolls;
        document.getElementById("ui-best").innerText = GAME.best.toLocaleString();
        renderTree();
    }

    setInterval(() => {
        let btn = document.getElementById("btn-roll");
        let txt = document.getElementById("cooldown-display");
        
        if (GAME.isRolling) return; 
        
        let now = Date.now();
        if (now >= GAME.cooldownReady) {
            btn.disabled = false;
            btn.innerText = "ROLL";
            txt.innerText = "Ready to roll!";
        } else {
            btn.disabled = true;
            let left = ((GAME.cooldownReady - now) / 1000).toFixed(1);
            btn.innerText = `WAIT (${left}s)`;
            txt.innerText = "Cooling down...";
        }
    }, 100);

    /* =====================================================================
       7. UPGRADE TREE RENDERING
       ===================================================================== */
    
    function canBuy(node) {
        if (GAME.upgrades.includes(node.id)) return false;
        if (node.req.length === 0) return true;
        return node.req.every(reqId => GAME.upgrades.includes(reqId));
    }

    function buyUpgrade(id) {
        let node = TREE.find(n => n.id === id);
        if (canBuy(node) && GAME.pts >= node.cost) {
            GAME.pts -= node.cost;
            GAME.upgrades.push(id);
            updateUI();
            saveGame();
        }
    }

    function renderTree() {
        [0, 1, 2, 3].forEach(tier => { document.getElementById(`tier-${tier}`).innerHTML = ""; });

        TREE.forEach(node => {
            let el = document.createElement("div");
            let isBought = GAME.upgrades.includes(node.id);
            let isUnlocked = canBuy(node);
            
            el.className = `tree-node ${isBought ? 'bought' : isUnlocked ? 'unlocked' : 'locked'}`;
            el.id = `node-${node.id}`;
            
            el.innerHTML = `
                <div class="node-title">${node.title}</div>
                <div class="node-desc">${node.desc}</div>
                <div class="node-cost">${isBought ? 'BOUGHT' : node.cost.toLocaleString() + ' pts'}</div>
            `;
            
            if (isUnlocked && GAME.pts >= node.cost) {
                el.onclick = () => buyUpgrade(node.id);
            }

            document.getElementById(`tier-${node.tier}`).appendChild(el);
        });
        
        setTimeout(drawLines, 50); 
    }

    function drawLines() {
        let svg = document.getElementById("svg-lines");
        svg.innerHTML = "";
        let containerRect = document.getElementById("tree-container").getBoundingClientRect();

        TREE.forEach(node => {
            node.req.forEach(reqId => {
                let el1 = document.getElementById(`node-${reqId}`);
                let el2 = document.getElementById(`node-${node.id}`);
                
                if (el1 && el2) {
                    let r1 = el1.getBoundingClientRect();
                    let r2 = el2.getBoundingClientRect();

                    let x1 = r1.left + r1.width / 2 - containerRect.left;
                    let y1 = r1.bottom - containerRect.top;
                    let x2 = r2.left + r2.width / 2 - containerRect.left;
                    let y2 = r2.top - containerRect.top;

                    let isUnlocked = GAME.upgrades.includes(node.id) || canBuy(node);
                    let color = isUnlocked ? "var(--accent)" : "var(--locked)";
                    let width = isUnlocked ? 3 : 2;

                    let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", x1);
                    line.setAttribute("y1", y1);
                    line.setAttribute("x2", x2);
                    line.setAttribute("y2", y2);
                    line.setAttribute("stroke", color);
                    line.setAttribute("stroke-width", width);
                    svg.appendChild(line);
                }
            });
        });
    }

    window.addEventListener("resize", drawLines);

    function saveGame() {
        localStorage.setItem('rngdleAchieveSave', JSON.stringify({
            pts: GAME.pts, rolls: GAME.rolls, best: GAME.best, upgrades: GAME.upgrades
        }));
    }

    function checkCode() {
        let code = document.getElementById("admin-code").value;
        if (code === "motherlode") {
            GAME.pts += 500000; // Increased to match new scaling
            document.getElementById("admin-code").value = "";
            updateUI();
            saveGame();
        } else if (code === "reset") {
            localStorage.removeItem('rngdleAchieveSave');
            location.reload();
        }
    }

    // Init
    updateUI();
</script>

</body>
